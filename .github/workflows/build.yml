name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Inno Setup publisher signature is not valid.' }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'Inno Setup compiler was not installed.' }

      - name: UI tests
        working-directory: overlay-ui
        run: npm ci && npm test

      - name: Runtime tests
        run: dotnet run --configuration Release --project runtime-tests/OverlayRuntime.Tests.csproj

      - name: Build installer
        shell: pwsh
        run: ./tools/Build-Installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ChaosBot-OBS-Overlay-Setup
          path: package/installer-output/ChaosBot-OBS-Overlay-Setup.exe
          if-no-files-found: error

      - name: Publish installer release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $asset = 'package/installer-output/ChaosBot-OBS-Overlay-Setup.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $asset).Status -ne 'Valid') {
            throw 'Release publishing requires a signed installer. This CI build is an unsigned validation artifact; use the Azure-signed release build.'
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset
            if ($LASTEXITCODE -ne 0) { throw "Uploading the installer to release $tag failed." }
          } else {
            gh release create $tag $asset --title "ChaosBot OBS Overlay $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Creating release $tag failed." }
          }
