name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Inno Setup publisher signature is not valid.' }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'Inno Setup compiler was not installed.' }

      - name: UI tests
        working-directory: overlay-ui
        run: npm ci && npm test

      - name: Runtime tests
        run: dotnet run --configuration Release --project runtime-tests/OverlayRuntime.Tests.csproj

      - name: Local connection boundary
        run: node tools/Test-RuntimeBoundary.mjs

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { (Get-Content buildspec.json -Raw | ConvertFrom-Json).version + '-beta.1' }
          ./tools/Build-Installer.ps1 -Version $version

      # Reuses the build folder the installer just configured, so OBS's dependencies download once.
      - name: Native tests
        shell: pwsh
        run: |
          cmake -S . -B build_x64 -DENABLE_TESTS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build_x64 --config Release --target native-tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build_x64 -C Release --output-on-failure -V

      - uses: actions/upload-artifact@v4
        with:
          name: ChaosBot-OBS-Overlay-Setup
          path: package/installer-output/ChaosBot-OBS-Overlay-Setup.exe
          if-no-files-found: error
